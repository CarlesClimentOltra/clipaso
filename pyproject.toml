[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipaso"
version = "0.1.0"
description = "Genera clips verticales cortos a partir de vídeos largos."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.0",
    "boto3>=1.34",
    "fastapi>=0.115",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "sentry-sdk[fastapi]>=2.20",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "truststore>=0.9",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# DLLs de CUDA 12 / cuDNN 9 que necesita CTranslate2 (faster-whisper) en GPU.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
# La API la necesita para enviar los jobs al worker de Modal (y para desplegarlo).
modal = [
    "modal>=1.0",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
clipaso = "clipaso.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clipaso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
